# Production stack for Dokploy.
#
# Routing and TLS: configure the hostname in Dokploy (Domains for this compose
# service). Dokploy injects Traefik - do not duplicate Traefik labels here.
#
# Before deploy, set in the Dokploy environment (or a referenced env file):
#   NEXT_PUBLIC_BASE_URL=https://your-domain.com
# Plus any secrets from `.env.example` (SMTP, Turnstile, GITHUB_TOKEN, etc.).
#
# Do not set `container_name` on services (Dokploy recommendation).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY:-}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_UPLOAD_DIR: ${CONTACT_UPLOAD_DIR:-}
      CONTACT_SMTP_DEBUG: ${CONTACT_SMTP_DEBUG:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    networks:
      - dokploy-network
    # Helps Traefik pick the right attachment IP when the container is on more than one network.
    # Does not add routers or TLS - Dokploy Domains still own routing and certificates.
    labels:
      - traefik.docker.network=dokploy-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  dokploy-network:
    external: true
